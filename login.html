<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f1efeb">
  <title>Sign in · Model Studio</title>
  <style>
    :root{color-scheme:light;--bg:#f1efeb;--panel:#f8f7f4;--ink:#20211f;--muted:#777771;--line:rgba(35,35,32,.16);font-family:Inter,"Segoe UI",Arial,sans-serif}*{box-sizing:border-box}body{min-height:100svh;margin:0;display:grid;place-items:center;padding:20px;background:var(--bg);color:var(--ink)}main{width:min(100%,390px);padding:34px;border:1px solid var(--line);border-radius:8px;background:var(--panel);box-shadow:0 18px 60px #1719180d}.eyebrow{margin:0 0 12px;color:var(--muted);font-size:10px;letter-spacing:.16em}h1{margin:0 0 8px;font-family:Georgia,serif;font-size:30px;font-weight:500}p{color:var(--muted);font-size:13px;line-height:1.6}label{display:block;margin:24px 0 7px;font-size:11px;font-weight:600}input{width:100%;height:44px;padding:0 12px;border:1px solid var(--line);border-radius:5px;background:var(--bg);color:var(--ink);font:inherit}button{width:100%;height:44px;margin-top:14px;border:0;border-radius:5px;background:#292a27;color:#fff;font:inherit;font-size:12px;font-weight:650;cursor:pointer}button:disabled{opacity:.6;cursor:wait}#loginError{min-height:20px;margin:10px 0 0;color:#9d3028;font-size:12px} 
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">MAZEN · PRIVATE VIEWER</p>
    <h1>Model Studio</h1>
    <p>Enter the studio password to view projects.</p>
    <form id="loginForm">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
      <button id="submitButton" type="submit">Sign in</button>
      <p id="loginError" role="alert" aria-live="polite"></p>
    </form>
  </main>
  <script src="login.js" defer></script>
</body>
</html>
