<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f1efeb">
  <title>Sign in · Model Studio</title>
  <style>
    :root{color-scheme:light;--bg:#e8ebf0;--panel:#e8ebf0;--ink:#20232a;--muted:#727985;--line:rgba(255,255,255,.65);--shadow-dark:#c4c9d1;--shadow-light:#fff;font-family:Inter,"Segoe UI",Arial,sans-serif}*{box-sizing:border-box}body{min-height:100svh;margin:0;display:grid;place-items:center;padding:20px;background:var(--bg);color:var(--ink)}main{width:min(100%,390px);padding:34px;border:1px solid var(--line);border-radius:20px;background:var(--panel);box-shadow:12px 12px 28px var(--shadow-dark),-12px -12px 28px var(--shadow-light);animation:login-enter .65s cubic-bezier(.2,.75,.25,1) both;transition:transform .25s ease,box-shadow .25s ease}main:hover{transform:translateY(-3px);box-shadow:15px 16px 32px var(--shadow-dark),-14px -14px 32px var(--shadow-light)}@keyframes login-enter{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:translateY(0) scale(1)}}@media(prefers-reduced-motion:reduce){main{animation:none;transition:none}}.brand-logo{position:absolute;top:20px;left:22px;width:76px;height:54px}.brand-logo img{display:block;width:100%;height:100%;object-fit:contain}main{position:relative}.login-top{display:flex;justify-content:flex-end;margin-bottom:12px}.language-label{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:11px}.language-label select{height:32px;padding:0 9px;border:0;border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;box-shadow:inset 4px 4px 8px var(--shadow-dark),inset -4px -4px 8px var(--shadow-light)}.eyebrow{margin:0 0 12px;color:var(--muted);font-size:10px;letter-spacing:.16em}h1{margin:0 0 8px;font-family:Georgia,serif;font-size:30px;font-weight:500}p{color:var(--muted);font-size:13px;line-height:1.6}form>label{display:block;margin:24px 0 7px;font-size:11px;font-weight:600}input{width:100%;height:44px;padding:0 12px;border:0;border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;box-shadow:inset 4px 4px 8px var(--shadow-dark),inset -4px -4px 8px var(--shadow-light)}button{width:100%;height:44px;margin-top:14px;border:0;border-radius:12px;background:var(--bg);color:var(--ink);font:inherit;font-size:12px;font-weight:650;cursor:pointer;box-shadow:6px 6px 12px var(--shadow-dark),-6px -6px 12px var(--shadow-light);transition:box-shadow .2s ease,transform .2s ease}button:hover{transform:translateY(-1px);box-shadow:4px 4px 9px var(--shadow-dark),-4px -4px 9px var(--shadow-light)}button:active{transform:translateY(0);box-shadow:inset 4px 4px 8px var(--shadow-dark),inset -4px -4px 8px var(--shadow-light)}button:disabled{opacity:.6;cursor:wait}#loginError{min-height:20px;margin:10px 0 0;color:#9d3028;font-size:12px}
  </style>
</head>
<body>
  <main>
    <div class="brand-logo"><img src="assets/Logo/Mazen%20Logo.png" alt="Mazen"></div>
    <div class="login-top"><label class="language-label"><span data-i18n="language">Language</span><select id="languageSelect" aria-label="Language"><option value="en">English</option><option value="zh">中文</option><option value="fr">Français</option><option value="de">Deutsch</option></select></label></div>
    <p class="eyebrow" data-i18n="eyebrow">MAZEN · PRIVATE VIEWER</p>
    <h1 data-i18n="title">Model Studio</h1>
    <p data-i18n="prompt">Enter the studio password to view projects.</p>
    <form id="loginForm">
      <label for="password" data-i18n="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
      <button id="submitButton" type="submit" data-i18n="signIn">Sign in</button>
      <p id="loginError" role="alert" aria-live="polite"></p>
    </form>
  </main>
  <script src="login.js" defer></script>
</body>
</html>
